<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マークダウンビューアー</title>
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Marked.js - Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Highlight.js - Syntax highlighting for code blocks -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>📝 マークダウンビューアー</h1>
            <div class="header-actions">
                <button id="uploadBtn" class="btn btn-secondary">📁 ファイルを開く</button>
                <button id="clearBtn" class="btn btn-danger">クリア</button>
                <button id="copyBtn" class="btn btn-primary">コピー</button>
                <button id="downloadBtn" class="btn btn-info">ダウンロード</button>
            </div>
        </div>
    </header>

    <main>
        <div class="editor-container">
            <div class="panel" id="leftPanel">
                <div class="panel-header">
                    <h2>📄 マークダウン入力</h2>
                    <span class="char-count" id="charCount">0 文字</span>
                </div>
                <textarea id="markdownInput" placeholder="ここにマークダウンテキストを貼り付けてください...

例：
# 見出し1
## 見出し2

**太字** *イタリック* ~~取り消し線~~

- リスト項目1
- リスト項目2

1. 番号付きリスト1
2. 番号付きリスト2

[リンク](https://example.com)

`インラインコード`

```javascript
// コードブロック
console.log('Hello World');
```

> 引用文

---

| カラム1 | カラム2 | カラム3 |
|---------|---------|---------|
| データ1 | データ2 | データ3 |
"></textarea>
            </div>

            <div class="resizer" id="resizer"></div>

            <div class="panel" id="rightPanel">
                <div class="panel-header">
                    <h2>👁️ プレビュー</h2>
                    <button id="fullscreenBtn" class="btn-icon" title="全画面表示">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                </div>
                <div id="preview" class="preview-content"></div>
            </div>
        </div>
    </main>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".txt,.md" style="display: none;">

    <!-- 共通ユーティリティ -->
    <script src="../js/utils.js"></script>
    <!-- アプリのロジック -->
    <script src="js/viewer.js"></script>
</body>
</html>
